  # caddy:
  #   image: caddy:2-alpine
  #   container_name: mybook-caddy
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #
  # volumes:
  #   caddy_data:
  #   caddy_config:
